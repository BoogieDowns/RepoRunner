name: RepoRunner CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/reporunner/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/reporunner-ci.yml"
  push:
    branches:
      - main
    paths:
      - "artifacts/reporunner/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/reporunner-ci.yml"

jobs:
  validate-reporunner:
    name: Validate RepoRunner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck RepoRunner
        working-directory: artifacts/reporunner
        run: pnpm run typecheck

      - name: Build Electron main process
        working-directory: artifacts/reporunner
        run: pnpm run electron:build-main

      - name: Build RepoRunner renderer
        working-directory: artifacts/reporunner
        run: pnpm run build
